<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cherry Club 🍒</title>
    <link rel="stylesheet" href="style.css?v=1">
    <script src="https://telegram.org"></script>
</head>
<body>

    <!-- ЭКРАН 1: СОВПАДЕНИЕ (MATCH) -->
    <div id="screen-match" class="screen screen-match hidden">
        <div class="match-title">Coincidence!</div>
        <div class="heart-container">
            <div class="heart-avatar bg-left">🤵</div>
            <div class="heart-avatar bg-right">💃</div>
        </div>
        <button onclick="goToRegister()" class="btn-pink uppercase">Start Chatting</button>
        <div class="sub-text">Keep on Playing</div>
    </div>

    <!-- ЭКРАН 2: АНКЕТА / РЕГИСТРАЦИЯ (В стиле профиля) -->
    <div id="screen-register" class="screen screen-profile hidden">
        <div class="profile-header">
            <div class="avatar-circle">🍒</div>
        </div>
        <div class="profile-body">
            <div class="form-group">
                <input type="text" id="reg-name" placeholder="Account Name, Age" class="profile-input-title">
                <input type="text" id="reg-city" placeholder="sheffield, england" class="profile-input-sub">
            </div>
            
            <div class="about-label">About</div>
            <textarea id="reg-bio" placeholder="Tell something about yourself..." rows="3" class="profile-textarea"></textarea>
            
            <div class="photo-grid">
                <div class="photo-box text-muted">PHOTO</div>
                <div class="photo-box text-muted">PHOTO</div>
                <div class="photo-box add-btn">+</div>
            </div>
            
            <button onclick="shareProfile()" class="btn-purple uppercase">Save & Publish</button>
        </div>
    </div>

    <!-- ЭКРАН 3: АНКЕТА ДРУГОГО ПОЛЬЗОВАТЕЛЯ (РЕЖИМ ПРОСМОТРА) -->
    <div id="screen-view" class="screen screen-profile hidden">
        <div class="profile-header">
            <div class="avatar-circle">👤</div>
        </div>
        <div class="profile-body">
            <h2 id="view-name" class="profile-title">Name, Age</h2>
            <p id="view-city" class="profile-sub">City, Country</p>
            
            <div class="about-label">About</div>
            <p id="view-bio" class="view-bio-text">Bio description...</p>
            
            <a id="view-chat-btn" href="#" target="_blank" class="btn-pink uppercase" style="text-decoration:none; text-align:center; display:block; line-height:24px;">Message</a>
        </div>
    </div>

    <script src="app.js?v=1"></script>
</body>
</html>

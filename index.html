<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cherry Club 🍒</title>
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://telegram.org"></script>
</head>
<body>

    <!-- ЭКРАН 1: АНКЕТА / РЕГИСТРАЦИЯ -->
    <div id="screen-register" class="screen screen-profile hidden">
        <div class="profile-header">
            <div class="header-logo-title">Cherry Club 🍒</div>
            <div class="avatar-circle">🍒</div>
        </div>
        <div class="profile-body">
            
            <div class="form-group-vertical">
                <!-- ИМЯ -->
                <input type="text" id="reg-name" placeholder="Имя" class="profile-input-line">
                
                <!-- ВОЗРАСТ (ПЕРЕНЕСЕН ПОД ИМЯ) -->
                <input type="number" id="reg-age" placeholder="Возраст" class="profile-input-line" min="18" max="99">
                
                <!-- ПОЛ (ДОБАВЛЕН ПОД ВОЗРАСТ) -->
                <div class="about-label" style="margin-top: 10px;">Ваш пол</div>
                <div class="toggle-container">
                    <button type="button" id="gender-male" class="toggle-btn active" onclick="selectGender('Парень')">Парень</button>
                    <button type="button" id="gender-female" class="toggle-btn" onclick="selectGender('Девушка')">Девушка</button>
                </div>
                <input type="hidden" id="reg-gender" value="Парень">

                <!-- ВЫБОР ГОРОДА -->
                <div class="about-label" style="margin-top: 10px;">Город</div>
                <input type="text" id="city-search" placeholder="Начните вводить город..." class="profile-input-search" oninput="filterCities()" onclick="showCityList()">
                <div id="city-dropdown" class="city-dropdown-list hidden"></div>
                <input type="hidden" id="reg-city" value="">
            </div>
            
            <!-- ВЫБОР ЦЕЛИ ЗНАКОМСТВА -->
            <div class="about-label">Цель знакомства</div>
            <div class="toggle-container">
                <button type="button" id="target-long" class="toggle-btn active" onclick="selectTarget('Длительное общение')">Длительное общение</button>
                <button type="button" id="target-short" class="toggle-btn" onclick="selectTarget('На одну ночь')">На одну ночь</button>
            </div>
            <input type="hidden" id="reg-target" value="Длительное общение">

            <!-- О СЕБЕ -->
            <div class="about-label" style="margin-top: 15px;">О себе</div>
            <textarea id="reg-bio" placeholder="Расскажите о себе и своих интересах..." rows="3" class="profile-textarea"></textarea>
            
            <!-- ЖИВАЯ ФУНКЦИОНАЛЬНАЯ ГАЛЕРЕЯ -->
            <div class="about-label" style="margin-top: 15px;">Фотография профиля</div>
            <div class="photo-grid">
                <div id="photo-preview" class="photo-box text-muted">НЕТ ФОТО</div>
                <label class="photo-box add-btn">
                    +
                    <input type="file" id="photo-file-input" accept="image/*" style="display:none;" onchange="handlePhotoUpload(this)">
                </label>
            </div>
            <input type="hidden" id="reg-photo-base64" value="">
            
            <button onclick="shareProfile()" class="btn-purple uppercase">Сохранить и опубликовать</button>
        </div>
    </div>

    <!-- ЭКРАН 2: АНКЕТА ДРУГОГО ПОЛЬЗОВАТЕЛЯ (ПРОСМОТР) -->
    <div id="screen-view" class="screen screen-profile hidden">
        <div class="profile-header">
            <div class="header-logo-title">Cherry Club 🍒</div>
            <!-- Сюда подгрузится фото пользователя или смайлик по умолчанию -->
            <div id="view-avatar-circle" class="avatar-circle">👤</div>
        </div>
        <div class="profile-body">
            <h2 id="view-name" class="profile-title">Имя, Возраст</h2>
            <p id="view-gender-city" class="profile-sub">Пол • Город</p>
            <p id="view-target" class="profile-target-tag">Цель: Длительное общение</p>
            
            <div class="about-label">О себе</div>
            <p id="view-bio" class="view-bio-text">Описание анкеты...</p>
            
            <a id="view-chat-btn" href="#" target="_blank" class="btn-pink uppercase" style="text-decoration:none; text-align:center; display:block; line-height:24px;">Написать</a>
        </div>
    </div>

    <script src="app.js?v=6"></script>
</body>
</html>
